# ---- 附件直发站（列表页每条就是一个附件直链，命中率接近 100%） ----

[[sites]]
name = "辽宁省发展改革委-通知公告"
base = "https://fgw.ln.gov.cn"
entry = "/fgw/index/tzgg/index.shtml"
# 列表页通过 pdfjs 预览器挂 PDF，真实地址在 viewer.html?file= 参数里
link_pattern = '/articleFileDir/.+\.pdf'
category = "省级发改委"

[[sites]]
name = "天津市发展改革委-通知公告"
base = "https://fzgg.tj.gov.cn"
entry = "/xxfb/tzggx/"
# 列表页直接挂 docx 附件
link_pattern = '/tzggx/\d+/W\d+\.docx'
category = "省级发改委"
