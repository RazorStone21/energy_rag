# 项目信息、依赖和代码检查配置；日常运行使用根目录 main.py。
[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-rag"
version = "0.2.0"
description = "中文能源文档检索与问答系统"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

# 流程层仅依赖标准库；真实模型和解析环境按需安装。
[project.optional-dependencies]
runtime = [
  "torch==2.8.0", "transformers>=4.52.0", "accelerate", "bitsandbytes",
  "sentence-transformers>=3.3.0", "FlagEmbedding>=1.3.0",
  "langchain>=0.3.0", "langchain-core", "langchain-community>=0.3.0",
  "langchain-huggingface>=0.1.0", "langchain-experimental>=0.3.0",
  "unstructured==0.16.25", "unstructured-inference==0.8.10", "unstructured.pytesseract>=0.3.12",
  "pdfminer.six", "pikepdf", "pdf2image", "pi-heif", "pypdf", "pdfplumber", "pymupdf", "Pillow",
  "markdown-it-py>=3,<5",
  "python-docx>=1.2,<2",
  "openpyxl>=3.1.5,<4",
  "pymilvus", "langchain-milvus", "huggingface_hub", "jieba",
]
evaluation = ["ragas", "datasets", "pandas", "nltk"]
# Web 界面：只有 main.py serve 用得到，导入 src 其他部分不会加载这些包。
server = ["fastapi>=0.115", "uvicorn>=0.30"]
dev = [
  "pytest",
  "ruff",
  "httpx>=0.27",
  "markdown-it-py>=3,<5",
  "python-docx>=1.2,<2",
  "openpyxl>=3.1.5,<4",
]

# 仅在选择安装项目时按实际目录查找 src 包，不设置包名到目录的映射。
[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

# 使用统一格式器与基础静态检查；业务说明采用中文文档字符串。
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

# 使用实际目录名作为本项目的导入包名。
[tool.ruff.lint.isort]
known-first-party = ["src"]
